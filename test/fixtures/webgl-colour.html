<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>colour WebGL fixture</title>
    <style>body{margin:0;background:#000}canvas{width:800px;height:600px}</style>
  </head>
  <body>
    <canvas id="c" width="800" height="600"></canvas>
    <script>
      window.THREE = { REVISION: "fixture-stub" };

      const canvas = document.getElementById("c");
      const gl = canvas.getContext("webgl");
      if (!gl) throw new Error("WebGL unavailable");

      const vertexSource = "attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }";
      const fragmentSource = `
        precision mediump float;
        void main() {
          vec2 uv = gl_FragCoord.xy / vec2(800.0, 600.0);
          float band = floor(uv.y * 5.0) / 5.0;
          vec3 col = mix(vec3(0.15, 0.45, 0.85), vec3(0.92, 0.25, 0.15), uv.x);
          col = mix(col, vec3(0.20, 0.80, 0.35), band);
          gl_FragColor = vec4(col, 1.0);
        }
      `;

      function shader(type, source) {
        const s = gl.createShader(type);
        gl.shaderSource(s, source);
        gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
        return s;
      }

      const program = gl.createProgram();
      gl.attachShader(program, shader(gl.VERTEX_SHADER, vertexSource));
      gl.attachShader(program, shader(gl.FRAGMENT_SHADER, fragmentSource));
      gl.linkProgram(program);
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));

      const quad = new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]);
      const buffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
      gl.bufferData(gl.ARRAY_BUFFER, quad, gl.STATIC_DRAW);

      const attribLocation = gl.getAttribLocation(program, "p");
      gl.useProgram(program);
      gl.enableVertexAttribArray(attribLocation);
      gl.vertexAttribPointer(attribLocation, 2, gl.FLOAT, false, 0, 0);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    </script>
  </body>
</html>
