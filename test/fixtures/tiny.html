<!doctype html>
<html>
  <head><meta charset="utf-8"><title>toy</title></head>
  <body>
    <canvas></canvas>
    <!-- A tiny toy demo: just a spinning red cube. No pagoda, no instancing,
         no controls, no particles, no HUD, no garden. -->
    <script src="https://unpkg.com/three@0.160.0/build/three.min.js"></script>
    <script>
      const r = new THREE.WebGLRenderer(); r.setSize(300, 300); document.body.appendChild(r.domElement);
      const s = new THREE.Scene();
      const c = new THREE.PerspectiveCamera(50, 1, 0.1, 100); c.position.z = 4;
      const box = new THREE.Mesh(new THREE.BoxGeometry(), new THREE.MeshBasicMaterial({ color: 0xff0000 }));
      s.add(box);
      function loop() { box.rotation.x += 0.01; box.rotation.y += 0.01; r.render(s, c); requestAnimationFrame(loop); }
      loop();
    </script>
  </body>
</html>
