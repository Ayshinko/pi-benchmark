<!doctype html>
<html>
  <head>
    <meta charset="utf-8">
    <title>black WebGL fixture</title>
    <style>body{margin:0;background:#000}canvas{width:800px;height:600px}</style>
  </head>
  <body>
    <canvas id="c" width="800" height="600"></canvas>
    <script>
      // Fixture stub so the "THREE is defined" gate is satisfied while the
      // render itself is intentionally a flat black rectangle.
      window.THREE = { REVISION: "fixture-stub" };

      const canvas = document.getElementById("c");
      const gl = canvas.getContext("webgl");
      if (!gl) throw new Error("WebGL unavailable");

      const vertexSource = "attribute vec2 p; void main(){ gl_Position = vec4(p, 0.0, 1.0); }";
      const fragmentSource = "precision mediump float; void main(){ gl_FragColor = vec4(0.0, 0.0, 0.0, 1.0); }";

      function shader(type, source) {
        const s = gl.createShader(type);
        gl.shaderSource(s, source);
        gl.compileShader(s);
        if (!gl.getShaderParameter(s, gl.COMPILE_STATUS)) throw new Error(gl.getShaderInfoLog(s));
        return s;
      }

      const program = gl.createProgram();
      gl.attachShader(program, shader(gl.VERTEX_SHADER, vertexSource));
      gl.attachShader(program, shader(gl.FRAGMENT_SHADER, fragmentSource));
      gl.linkProgram(program);
      if (!gl.getProgramParameter(program, gl.LINK_STATUS)) throw new Error(gl.getProgramInfoLog(program));

      const quad = new Float32Array([-1, -1, 1, -1, -1, 1, 1, 1]);
      const buffer = gl.createBuffer();
      gl.bindBuffer(gl.ARRAY_BUFFER, buffer);
      gl.bufferData(gl.ARRAY_BUFFER, quad, gl.STATIC_DRAW);

      const attribLocation = gl.getAttribLocation(program, "p");
      gl.useProgram(program);
      gl.enableVertexAttribArray(attribLocation);
      gl.vertexAttribPointer(attribLocation, 2, gl.FLOAT, false, 0, 0);
      gl.clearColor(0, 0, 0, 1);
      gl.clear(gl.COLOR_BUFFER_BIT);
      gl.drawArrays(gl.TRIANGLE_STRIP, 0, 4);
    </script>
  </body>
</html>
